<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Overlord 2.5.22 // Live Progress</title>
  <style>
    :root { color-scheme: dark; --bg:#09090d; --panel:#0e1113; --fg:#d7f9e9; --dim:#728079; --m:#ff4fd8; --g:#75f59a; --c:#59d5ff; --y:#ffd166; --r:#ff6b7a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 "JetBrains Mono",Consolas,monospace; padding:28px; }
    main { max-width:920px; margin:auto; border:1px solid #27312c; padding:22px; background:var(--panel); box-shadow:0 0 40px #000; }
    h1 { font-size:16px; margin:0 0 5px; color:var(--m); }
    .meta { color:var(--dim); font-size:12px; }
    .watchdog { display:inline-block; margin-top:12px; padding:3px 8px; border:1px solid #34413a; color:var(--c); }
    .watchdog.stalled,.watchdog.error { color:var(--r); border-color:#63313a; animation:pulse .8s steps(2,end) infinite; }
    .bar { height:8px; border:1px solid #31443a; margin:20px 0; background:#101814; overflow:hidden; }
    .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--g),var(--c)); transition:width .35s ease; }
    .spark { color:var(--m); letter-spacing:1px; animation:scan 1.1s steps(2,end) infinite; }
    section { border-top:1px dashed #34413a; padding-top:14px; margin-top:14px; }
    .row { display:grid; grid-template-columns:180px 1fr 80px; gap:10px; padding:6px 0; }
    .done { color:var(--g); } .active { color:var(--c); } .pending { color:var(--dim); } .fail { color:var(--r); }
    @keyframes scan { 50% { opacity:.35; } }
    @keyframes pulse { 50% { opacity:.45; } }
    @media (max-width:640px) { body{padding:12px}.row{grid-template-columns:1fr}.row span:last-child{display:none} }
    @media (prefers-reduced-motion:reduce) { .spark,.watchdog.stalled,.watchdog.error{animation:none} }
  </style>
</head>
<body>
  <main>
    <h1>OVERLORD 2.5.22 // BUILD TELEMETRY</h1>
    <div id="meta" class="meta">CONNECTING...</div>
    <div id="watchdog" class="watchdog">WATCHDOG CONNECTING...</div>
    <div class="bar"><i id="bar"></i></div>
    <div id="spark" class="spark"></div>
    <section id="tasks"></section>
    <section><div class="meta">LATEST EVENT</div><div id="event">Awaiting data...</div></section>
  </main>
  <script>
    const meta = document.getElementById("meta");
    const bar = document.getElementById("bar");
    const spark = document.getElementById("spark");
    const tasks = document.getElementById("tasks");
    const event = document.getElementById("event");
    const watchdog = document.getElementById("watchdog");

    async function load() {
      try {
        const nonce = Date.now();
        const [progress, guard] = await Promise.all([
          fetch(`progress.json?${nonce}`).then((response) => response.json()),
          fetch(`watchdog.json?${nonce}`).then((response) => response.json()),
        ]);
        const completed = progress.tasks.filter((task) => task.status === "done").length;
        const active = progress.tasks.filter((task) => task.status === "active").length;
        meta.textContent = `VERSION ${progress.version} | ELAPSED ${progress.elapsed} | ${completed}/${progress.tasks.length} MILESTONES COMPLETE`;
        bar.style.width = "100%";
        bar.firstElementChild.style.width = `${Math.round((completed / Math.max(1, progress.tasks.length)) * 100)}%`;
        spark.textContent = active ? "▁▃▅▇▅▃▁  WORK IN PROGRESS  ▁▃▅▇▅▃▁" : "━━━━━━━━  STANDBY  ━━━━━━━━";
        tasks.innerHTML = progress.tasks.map((task) => `<div class="row"><strong>${task.name}</strong><span>${task.detail}</span><span class="${task.status}">${task.status.toUpperCase()}</span></div>`).join("");
        event.textContent = progress.event;
        watchdog.className = `watchdog ${guard.status}`;
        watchdog.textContent = `WATCHDOG v${guard.version} ${guard.status.toUpperCase()} | ${guard.detail}`;
      } catch (error) {
        meta.textContent = `TELEMETRY ERROR | ${error.message}`;
      }
    }

    load();
    setInterval(load, 1000);
  </script>
</body>
</html>
